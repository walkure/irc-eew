name: 'build-and-push'
description: 'Container build and push'
inputs:
  artifact:
    description: 'Name of Artifact'
    required: true
  context:
    description: 'Context Path'
    required: true
  dockerfile:
    description: 'Dockerfile name, relative to context'
    required: false
    default: 'Dockerfile'
  tag_prefix:
    description: 'Prefix prepended to every generated tag (e.g. "go-" to publish as image:go-latest instead of a separate image repo), empty for no prefix'
    required: false
    default: ''
  GITHUB_TOKEN:
    description: 'GitHub Access Token'
    required: true

runs:
  using: "Composite"
  steps:
  - name: Log in to the Container registry
    uses: docker/login-action@v3.1.0
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.GITHUB_TOKEN }}

  - name: Extract metadata (tags, labels) for Docker
    id: meta
    uses: docker/metadata-action@v5.5.1
    with:
      images: ${{ env.REPOSITORY }}/${{ inputs.artifact }}
      flavor: ${{ inputs.tag_prefix != '' && format('prefix={0},onlatest=true', inputs.tag_prefix) || '' }}
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=sha,prefix=${{ inputs.tag_prefix }}sha-
        type=raw,value=latest

  - name: Build and push Docker image
    uses: docker/build-push-action@v5.3.0
    with:
      context: ${{ inputs.context }}
      file: ${{ inputs.context }}/${{ inputs.dockerfile }}
      push: true
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
